name: Fixed OpenClaw contract
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - run: curl --fail --location --retry 3 https://github.com/pler1y/openclaw-telegram-ux/releases/download/v0.1.0-beta.1/openclaw-telegram-ux-0.1.0-beta.1.tgz -o artifacts/baseline.tgz
      - run: node scripts/install-check.mjs artifacts/openclaw-telegram-ux-0.2.0-beta.1.tgz artifacts/baseline.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-ux-beta
          path: artifacts/
